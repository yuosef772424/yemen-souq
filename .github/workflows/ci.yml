# حارس آلي للحُزمة.
#
# 373 اختباراً كانت تعتمد على أن يتذكّر أحدهم تشغيلها. والحرّاس المعماريون
# الستة تحديداً بلا معنى بلا هذا الملف: قاعدة «لا تُسجَّل وحدة يدوياً» تُكتشف
# عند تشغيل الحُزمة لا عند كتابة الكود.
#
# لا خدمة قاعدة بيانات هنا بقصد: phpunit.xml يضبط sqlite في الذاكرة، فالحُزمة
# مكتفية بذاتها.
#
# ولا خطوة npm: القوالب تستدعي ‎@vite، لكن Tests\TestCase يستدعي withoutVite
# فلا تحتاج الحُزمة أصولاً مبنيّة. أول تشغيل لهذا الملف أسقط تسعة وثلاثين
# اختباراً بـ«Vite manifest not found» — وكانت تمرّ محلياً بفضل public/hot
# المتخلّف عن npm run dev، وهو أثر غير مُتتبَّع يختفي في أي استنساخ نظيف.
# أي أن الحُزمة لم تكن خضراء، بل كانت تبدو كذلك على جهاز واحد.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # دفعة جديدة على نفس الفرع تُلغي سابقتها — لا فائدة من نتيجة كوميت متجاوَز
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: الاختبارات
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.2 هو الحدّ الأدنى في composer.json — يُختبر الأدنى لا الأعلى،
          # فالعطل الذي يظهر عليه وحده هو ما يفوت المطوّر
          php-version: '8.2'
          # gd لأجل intervention/image، وsqlite لأجل حُزمة الاختبارات
          extensions: mbstring, dom, xml, curl, zip, gd, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: تحديد مخبأ composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: استرجاع المخبأ
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.2-

      - name: تثبيت الاعتماديات
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: تهيئة البيئة
        run: |
          cp .env.example .env
          php artisan key:generate
          # HealthCheck يعدّ غياب public/storage عطلاً — والتطبيق السليم
          # يملك الرابط. غيابه هنا نقصٌ في تهيئة CI لا خطأ في الفحص
          php artisan storage:link

      - name: تشغيل الحُزمة
        run: php artisan test

  # ═══════════════════════════════════════════════════════════════════
  # صورة النشر — تُبنى وتُشغَّل، لا تُبنى وحدها
  # ═══════════════════════════════════════════════════════════════════
  #
  # أُضيفت بعد أول نشر حقيقي، وفيه ستة أعطال متتالية كلها كانت قابلة
  # للاكتشاف قبل الوصول إلى المنصة: امتداد ناقص، وentrypoint يفشل،
  # وAPP_URL معطوب، ومنفذ لا يستمع عليه أحد. كلٌّ منها كلّف دورة نشر
  # كاملة ليظهر، وبعضها ظهر برسالة لا تدلّ على سببه.
  #
  # ولهذا لا يكفي `docker build`: البناء كان ينجح في أغلب تلك الأعطال،
  # والانهيار يقع عند الإقلاع. فالوظيفة هنا **تشغّل الحاوية وتنادي
  # الخادم** — وهو الفرق بين فحص يطمئنك وفحص يحميك.

  image:
    name: صورة النشر
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # مخبأ GitHub للطبقات: تصريف الامتدادات (وintl خاصةً) يستغرق
      # دقائق، ولا يتغيّر إلا حين يتغيّر Dockerfile نفسه
      - name: بناء الصورة
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yemen-souq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # الحارس يجب أن يرفض، والنجاح هنا هو الفشل
      - name: حارس APP_URL يرفض قيمة معطوبة
        run: |
          if docker run --rm -e APP_URL=https:// yemen-souq:ci true 2>/dev/null; then
            echo "::error::حارس APP_URL لم يرفض 'https://' — الحاوية ستدخل حلقة إقلاع على المنصة"
            exit 1
          fi
          echo "الحارس رفض القيمة المعطوبة كما يجب"

      # العطل الذي كلّف أطول وقت: الخادم يعمل على منفذ لا يوجَّه إليه
      # شيء. المنصة تحقن PORT، والصورة كانت تتجاهله — فتبدو الحاوية
      # حيّة ولا يصلها طلب واحد. المنفذ هنا غير قياسي بقصد: 80 كان
      # سيمرّ بالصدفة
      - name: الحاوية تستمع على المنفذ الذي تُملى به
        run: |
          docker run -d --name souq-ci -p 9137:9137 \
            -e PORT=9137 \
            -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" \
            -e APP_URL=http://localhost:9137 \
            -e APP_ENV=production \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=:memory: \
            yemen-souq:ci

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9137/up || echo 000)
            [ "$code" = "200" ] && echo "الخادم ردّ 200 على /up بعد ${i}ث" && exit 0
            sleep 1
          done

          echo "::error::لا استجابة على المنفذ 9137 خلال 30 ثانية — آخر رمز: ${code}"
          docker logs souq-ci
          exit 1

      - name: إيقاف الحاوية
        if: always()
        run: docker rm -f souq-ci 2>/dev/null || true
